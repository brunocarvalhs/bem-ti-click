# Testa, gera o build (Vite) e publica no GitHub Pages a cada push na master.
# Uma vez só: Settings → Pages → Source = "GitHub Actions".
# Opcional: Settings → Secrets and variables → Actions → Variables: VITE_GA_ID, VITE_RANK_URL, VITE_RANK_KEY.
name: Publicar no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_RANK_URL: ${{ vars.VITE_RANK_URL }}
          VITE_RANK_KEY: ${{ vars.VITE_RANK_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
